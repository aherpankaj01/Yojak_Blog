spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yojak_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
server.port=${PORT:8082}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.connection-timeout=5000

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:3d502b6ef6595a5297fca8c79611c688a9f609535854187c08cf9de594628c98}
jwt.expiration-ms=86400000

file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}


app.otp.expiry-minutes=5
app.otp.resend-cooldown-seconds=30
app.otp.max-attempts=5
app.otp.max-sends=5

brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=Yojak

app.password-reset.expiry-minutes=30
app.password-reset.cooldown-seconds=60
app.frontend-url=${FRONTEND_URL:http://localhost:5173}